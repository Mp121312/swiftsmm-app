name: Build TWA App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli

      - name: Build App (Bypass Prompts)
        run: |
          # 1. JDK prompt ko bypass karne ke liye config file banana
          mkdir -p ~/.bubblewrap
          echo '{"jdkPath":"'$JAVA_HOME'","androidSdkPath":"/usr/local/lib/android/sdk"}' > ~/.bubblewrap/config.json
          
          mkdir -p twa
          cd twa
          
          # 2. Ek temporary signing key auto-generate karna
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Android, OU=Android, O=Android, L=Android, S=Android, C=US"
          
          # 3. App ki details pehle se set karna (Taki koi sawal na puche)
          echo '{"packageId": "com.swiftsmm.app", "host": "www.swiftsmm.com", "name": "Swiftsmm", "launcherName": "Swiftsmm", "display": "standalone", "themeColor": "#E62E6B", "navigationColor": "#E62E6B", "backgroundColor": "#E62E6B", "startUrl": "/", "iconUrl": "https://www.swiftsmm.com/favicon.ico", "maskableIconUrl": "https://www.swiftsmm.com/favicon.ico", "appVersionName": "1.0.0", "appVersionCode": 1, "shortcuts": [], "generatorApp": "bubblewrap-cli", "webManifestUrl": "https://www.swiftsmm.com/manifest.json", "fallbackType": "customtabs", "features": {}, "enableNotifications": true, "isChromeOSOnly": false, "isMetaQuest": false, "fullScopeUrl": "https://www.swiftsmm.com/", "minSdkVersion": 19, "signingKey": {"path": "./android.keystore", "alias": "android"}}' > twa-manifest.json
          
          # 4. Direct build command chalana
          npx @bubblewrap/cli build
        env:
          CI: true
          BUBBLEWRAP_KEYSTORE_PASSWORD: "password123"
          BUBBLEWRAP_KEY_PASSWORD: "password123"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-files
          path: twa/*.aab
